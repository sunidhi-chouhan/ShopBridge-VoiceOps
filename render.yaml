# Render Blueprint — https://render.com/docs/blueprint-spec
# Secrets use sync: false. Render asks for them once when you create the Blueprint.
# Do not put key values in this file.

services:
  - type: web
    name: shopbridge
    runtime: node
    plan: free
    region: singapore
    branch: main
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shopbridge-db
          property: connectionString
      - key: SHOPBRIDGE_AUTO_MIGRATE
        value: "1"
      - key: SHOPBRIDGE_DEMO_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_LIVE_FALLBACK_MODELS
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXCONN_API_BASE
        value: https://api.sg-light-api.com
      - key: VOICEOPS_DEMO
        value: "1"
      - key: VOICEOPS_MAX_CONCURRENT
        value: "3"
      - key: VOICEOPS_MAX_SESSIONS_PER_IP_DAY
        value: "40"
      - key: VOICEOPS_MAX_AUDIO_MIN_PER_DAY
        value: "180"

databases:
  - name: shopbridge-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
